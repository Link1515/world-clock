name: Deploy
on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Install pnpm 🔧
        uses: pnpm/action-setup@v2
        with:
          version: 8
          run_install: true

      - name: Run tests 🧪
        run: pnpm test

      - name: Install Playwright Browsers 🔧
        run: pnpm exec playwright install --with-deps

      - name: Run e2e tests 🧪
        run: pnpm test:e2e

      - name: Build ⚙️
        run: pnpm build

      - name: Upload artifact 📤
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy 🚀
        id: deployment
        uses: actions/deploy-pages@v4
